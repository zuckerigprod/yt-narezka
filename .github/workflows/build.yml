name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/ytdown_narezki.exe "dist/YT-Narezki.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/YT-Narezki.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - name: Build universal binary
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/ytdown_narezki \
            target/aarch64-apple-darwin/release/ytdown_narezki \
            target/x86_64-apple-darwin/release/ytdown_narezki
      - name: Make .app
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          APP="dist/YT Narezki.app"
          mkdir -p "$APP/Contents/MacOS"
          mv dist/ytdown_narezki "$APP/Contents/MacOS/"
          sed "s/VERSION/$VERSION/g" macos/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          cd dist && ditto -c -k --keepParent "YT Narezki.app" YT-Narezki-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/YT-Narezki-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/windows/YT-Narezki.exe
            out/macos/YT-Narezki-macOS.zip
